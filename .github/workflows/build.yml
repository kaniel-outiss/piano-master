name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: mkdir -p www && cp app.html www/index.html
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      # Signature FIXE : même clé à chaque build → l'APK se met à jour par-dessus l'ancien (plus besoin de désinstaller)
      - run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
      # versionCode croissant à chaque build (Android refuse une mise à jour vers un code inférieur)
      - run: sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$(node -p "require('./package.json').version")\"/" android/app/build.gradle && grep -E "versionCode|versionName" android/app/build.gradle
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk piano-master.apk
      - uses: actions/upload-artifact@v4
        with: {name: piano-master.apk, path: piano-master.apk}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Piano Master build ${{ github.run_number }}
          files: piano-master.apk
